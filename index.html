<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 6: Negative and Question Forms</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fc;color:#203047;line-height:1.4}header{background:#17365d;color:white;text-align:center;padding:22px 12px}header h1{margin:0;font-size:clamp(23px,5vw,32px)}header p{margin:5px 0 0}main{max-width:850px;margin:18px auto;padding:0 12px 32px}.card{background:white;border:1px solid #e1e8f2;border-radius:12px;padding:14px clamp(12px,2.5vw,18px);margin-bottom:12px;box-shadow:0 3px 12px #17365d0c}h2{color:#17365d;margin:0 0 12px}.instruction{background:#fff4c7;border-left:5px solid #e5ad19;border-radius:9px;padding:12px 14px}.muted{color:#63728a}.question{border:1px solid #e1e8f2;border-radius:10px;padding:10px 12px;margin:8px 0}.qhead{font-weight:bold;margin-bottom:6px;color:#17365d}.sentence{font-size:16px;margin:6px 0}.inputs{display:flex;gap:8px;flex-wrap:wrap}.inputs input{flex:1;min-width:90px;width:100%;padding:8px 10px;border:1.5px solid #cbd8e9;border-radius:8px;font-size:15px}.btn{border:0;border-radius:9px;background:#2767c8;color:#fff;padding:9px 14px;font-size:15px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{background:#e6edf7;color:#203047}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.feedback{display:none;padding:10px;border-radius:9px;margin-top:10px}.feedback.show{display:block}.feedback.good{background:#e7fff0;color:#155f3a}.feedback.bad{background:#fff0f1;color:#922331}.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold}.pill{background:#edf4ff;border-radius:20px;padding:6px 10px}.progress{height:8px;background:#e4eaf3;border-radius:8px;margin:12px 0}.bar{height:100%;background:#29a36a;width:0}.hidden{display:none!important}.finish{text-align:center}.score{font-size:30px;font-weight:bold;color:#17365d}@media(max-width:500px){.question{padding:10px}.inputs{flex-direction:column}.inputs input{width:100%}}
mark{background:transparent!important;color:inherit!important} .sentence b{background:transparent!important} p{margin:7px 0} .muted{font-size:14px} @media(max-width:520px){.question{padding:9px}.sentence{font-size:15px}.inputs input{padding:8px 9px}} mark, .highlight, .yellow-highlight, .qhead, .sentence, .sentence b, .question b, .question p, .question strong, .question span {background:transparent!important;background-color:transparent!important;background-image:none!important;color:inherit} strong, b {background-color:transparent!important;background-image:none!important} </style></head>
<body>
<header><h1>Negative and Question Forms</h1><p>Grade 6 English Practice</p></header>
<main>
<section class="card" id="intro">
<h2>Instruction</h2>
<div class="instruction">Rewrite each sentence in the negative and question forms.</div>
<p class="muted">Type your answers in the boxes. Each answer is checked once. A wrong answer cannot be changed.</p>
<button class="btn" onclick="begin()">Start Exercise</button>
</section>
<section class="card hidden" id="quiz">
<div class="status"><span class="pill" id="counter"></span><span class="pill" id="score"></span></div><div class="progress"><div class="bar" id="bar"></div></div>
<div id="questionArea"></div>
<div class="actions"><button class="btn" id="checkBtn" onclick="checkCurrent()">Check answers</button><button class="btn" id="nextBtn" disabled onclick="nextQuestion()">Next →</button><button class="btn secondary" onclick="goHome()">Exit</button></div>
<div id="globalFeedback" class="feedback" aria-live="polite"></div>
</section>
<section class="card hidden finish" id="finish">
<h2>Exercise Complete!</h2><div class="score" id="finalScore"></div><p id="finalText"></p><button class="btn" onclick="begin()">Try Again</button><button class="btn secondary" onclick="goHome()">Back</button>
</section>
</main>
<script>
const items=[
{base:"I play football after school.",negBefore:"I",negAfter:"football after school.",negAux:"don't",negVerb:"play",qBefore:"",qSubject:"you",qTail:"football after school",qAux:"Do",qVerb:"play",ex:"Với chủ ngữ “I”, dùng “don't” để phủ định và “Do” để hỏi. Động từ chính giữ nguyên mẫu “play”."},
{base:"She likes apples.",negBefore:"She",negAfter:"apples.",negAux:"doesn't",negVerb:"like",qBefore:"",qSubject:"she",qTail:"apples",qAux:"Does",qVerb:"like",ex:"Với chủ ngữ “she”, dùng “doesn't” để phủ định và “Does” để hỏi. Sau does/doesn't, động từ dùng nguyên mẫu “like”."},
{base:"They watch TV after dinner.",negBefore:"They",negAfter:"TV after dinner.",negAux:"don't",negVerb:"watch",qBefore:"",qSubject:"they",qTail:"TV after dinner",qAux:"Do",qVerb:"watch",ex:"Với chủ ngữ “they”, dùng “don't” trong câu phủ định và “Do” ở đầu câu hỏi; động từ “watch” giữ nguyên mẫu."},
{base:"He plays basketball on Sundays.",negBefore:"He",negAfter:"basketball on Sundays.",negAux:"doesn't",negVerb:"play",qBefore:"",qSubject:"he",qTail:"basketball on Sundays",qAux:"Does",qVerb:"play",ex:"Với chủ ngữ “he”, dùng “doesn't/Does”. Khi có does/doesn't, động từ chính trở về nguyên mẫu “play”."},
{base:"We go to school by bike.",negBefore:"We",negAfter:"to school by bike.",negAux:"don't",negVerb:"go",qBefore:"",qSubject:"you",qTail:"to school by bike",qAux:"Do",qVerb:"go",ex:"Với chủ ngữ “we”, dùng “don't” để phủ định. Câu hỏi với “you” bắt đầu bằng “Do”; động từ giữ nguyên mẫu “go”."},
{base:"Tom reads books every night.",negBefore:"Tom",negAfter:"books every night.",negAux:"doesn't",negVerb:"read",qBefore:"",qSubject:"Tom",qTail:"books every night",qAux:"Does",qVerb:"read",ex:"“Tom” tương đương “he”, nên dùng “doesn't/Does”. Sau trợ động từ does, dùng động từ nguyên mẫu “read”."},
{base:"You have a new bag.",negBefore:"You",negAfter:"a new bag.",negAux:"don't",negVerb:"have",qBefore:"",qSubject:"you",qTail:"a new bag",qAux:"Do",qVerb:"have",ex:"Với chủ ngữ “you”, dùng “don't” trong câu phủ định và “Do” ở đầu câu hỏi; động từ “have” giữ nguyên mẫu."},
{base:"My mother cooks dinner every day.",negBefore:"My mother",negAfter:"dinner every day.",negAux:"doesn't",negVerb:"cook",qBefore:"",qSubject:"my mother",qTail:"dinner every day",qAux:"Does",qVerb:"cook",ex:"“My mother” tương đương “she”, nên dùng “doesn't/Does”. Động từ chính trở về nguyên mẫu “cook”."},
{base:"The boys play computer games.",negBefore:"The boys",negAfter:"computer games.",negAux:"don't",negVerb:"play",qBefore:"",qSubject:"the boys",qTail:"computer games",qAux:"Do",qVerb:"play",ex:"Chủ ngữ số nhiều “the boys” dùng “don't” và “Do”. Động từ chính giữ nguyên mẫu “play”."},
{base:"Lan studies English on Monday.",negBefore:"Lan",negAfter:"English on Monday.",negAux:"doesn't",negVerb:"study",qBefore:"",qSubject:"Lan",qTail:"English on Monday",qAux:"Does",qVerb:"study",ex:"“Lan” tương đương “she”, nên dùng “doesn't/Does”. Sau does, “studies” đổi về động từ nguyên mẫu “study”."}
]
let index=0,score=0,locked=false;
function begin(){index=0;score=0;document.getElementById('intro').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
function render(){locked=false;const it=items[index];document.getElementById('counter').textContent=`Question ${index+1} / ${items.length}`;document.getElementById('score').textContent=`Score: ${score} / ${items.length*2}`;document.getElementById('bar').style.width=`${index/items.length*100}%`;document.getElementById('globalFeedback').className='feedback';document.getElementById('globalFeedback').textContent='';document.getElementById('checkBtn').disabled=false;document.getElementById('nextBtn').disabled=true;
document.getElementById('questionArea').innerHTML=`<div class="question"><div class="qhead">${index+1}. Change the sentence:</div><div class="sentence"><b>Original:</b> ${it.base}</div><p><b>Negative form (Câu phủ định)</b></p><p class="muted">Example: I don't play. / She doesn't play.</p><div class="sentence">${it.negBefore} <span class="inputs" style="display:inline-flex;vertical-align:middle"><input id="negAux" placeholder="" aria-label="Negative auxiliary"><input id="negVerb" placeholder="" aria-label="Negative verb"></span> ${it.negAfter}</div><p><b>Question form (Câu nghi vấn)</b></p><p class="muted">Example: Do you play…? / Does she play…?</p><div class="sentence"><input id="qAux" placeholder="" aria-label="Question auxiliary" style="width:100px;display:inline-block;vertical-align:middle"> ${it.qSubject} <input id="qVerb" placeholder="" aria-label="Question verb" style="width:120px;display:inline-block;vertical-align:middle"> ${it.qTail}?</div><div id="feedback" class="feedback"></div></div>`;
}
function norm(s){return s.toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim()}
function checkCurrent(){if(locked)return;const ids=['negAux','negVerb','qAux','qVerb'];const vals=ids.map(id=>document.getElementById(id).value.trim());if(vals.some(v=>!v)){document.getElementById('globalFeedback').className='feedback show bad';document.getElementById('globalFeedback').textContent='Vui lòng điền đủ 4 ô trước khi chấm bài.';return}
locked=true;const it=items[index];const checks=[vals[0].toLowerCase()===it.negAux.toLowerCase(),vals[1].toLowerCase()===it.negVerb.toLowerCase(),vals[2].toLowerCase()===it.qAux.toLowerCase(),vals[3].toLowerCase()===it.qVerb.toLowerCase()];score+=checks.filter(Boolean).length;ids.forEach(id=>document.getElementById(id).disabled=true);document.getElementById('checkBtn').disabled=true;
const fb=document.getElementById('feedback');fb.className='feedback show '+(checks.every(Boolean)?'good':'bad');fb.innerHTML=`<b>Câu phủ định:</b> ${it.negBefore} ${it.negAux} ${it.negVerb} ${it.negAfter}<br><b>Câu nghi vấn:</b> ${it.qAux} ${it.qVerb} ${it.qAfter}?<p>${it.ex}</p><p>${checks.every(Boolean)?'Cả 4 ô đều đúng!':'Có ô chưa đúng. Bạn không thể sửa lại đáp án.'}</p>`;
document.getElementById('score').textContent=`Score: ${score} / ${items.length*2}`;document.getElementById('nextBtn').disabled=false;document.getElementById('globalFeedback').className='feedback show '+(checks.every(Boolean)?'good':'bad');document.getElementById('globalFeedback').textContent=checks.every(Boolean)?'Great job!':'Xem đáp án và phần giải thích ở trên.'}
function nextQuestion(){if(!locked)return;index++;if(index>=items.length){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('bar').style.width='100%';document.getElementById('finalScore').textContent=`${score} / ${items.length*2}`;document.getElementById('finalText').textContent='Review the Vietnamese explanations to learn from each answer.'}else render()}
function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('intro').classList.remove('hidden')}
</script></body></html>
